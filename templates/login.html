{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}<section class="auth"><div class="panel auth-card"><h1>Welcome back</h1><p>Sign in to explore shows and manage tickets.</p>
<form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Email address<input name="email" type="email" required maxlength="254" autocomplete="username" value="{{ request.form.get('email', '') }}"></label>
<label>Password<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
<button class="button">Log in</button></form><p>New to MovieMagic? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
